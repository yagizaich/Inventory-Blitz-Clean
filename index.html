<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blitz Clean</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

   <div class="inventory-card"> 
    <form name="myForm">
    <p>User:</p>
    <div class="user-group">
        <label><input type="radio" name="user" value="Rifki">Rifki</label>
        <label><input type="radio" name="user" value="Daniel">Daniel</label>
    </div>
        
    <p>Pilih Barang:</p>
    <div class="radio-group">
        <label><input type="radio" name="pilihan_barang" value="Blitz Clean"> Blitz Clean</label>
        <label><input type="radio" name="pilihan_barang" value="Washing Machine"> Washing Machine</label>
        <label><input type="radio" name="pilihan_barang" value="Deep Blitz"> Deep Blitz</label>
        <label><input type="radio" name="pilihan_barang" value="Microfiber"> Microfiber</label>
    </div>

    <input type="number" name="jumlah_barang" placeholder="Jumlah barang" required>
        <button type="submit">Simpan</button>
</form>
</div>
<script src="script.js"></script>
</body>

</html>
